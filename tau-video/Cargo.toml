[package]
name = "tau-video"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Portable tools for the Tau TNV3 media format"

[features]
default = []
cli = []
c-encoder = ["dep:serde_json"]
c-audio-decoder = []
experimental-c-orchestrator = []
experimental-rust-encoder = []
mp3-cli = []
block-motion = ["experimental-rust-encoder"]
b-pictures = ["experimental-rust-encoder"]
safe-rate = ["experimental-rust-encoder"]

[dependencies]
serde_json = { version = "1", optional = true }

[[bin]]
name = "tau-video"
path = "src/bin/tau-video.rs"
required-features = ["cli"]

[[bin]]
name = "tau-mp3"
path = "src/bin/tau-mp3.rs"
required-features = ["mp3-cli"]
