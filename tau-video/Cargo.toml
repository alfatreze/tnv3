[package]
name = "tau-video"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Portable tools for the Tau TNV3 media format"

[features]
default = []
cli = []
mp3-cli = []
block-motion = []
b-pictures = []

[[bin]]
name = "tau-video"
path = "src/bin/tau-video.rs"
required-features = ["cli"]

[[bin]]
name = "tau-mp3"
path = "src/bin/tau-mp3.rs"
required-features = ["mp3-cli"]
