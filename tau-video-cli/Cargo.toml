[package]
name = "tau-codecs-cli"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tau-video = { path = "../tau-video", features = ["c-encoder", "c-orchestrator", "c-audio-decoder", "c-mux", "c-subtitles", "subtitle-builder"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
