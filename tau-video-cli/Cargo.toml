[package]
name = "tau-codecs-cli"
version = "0.3.0"
edition = "2024"

[dependencies]
tau-video = { path = "../tau-video", features = ["c-encoder", "experimental-c-orchestrator"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
