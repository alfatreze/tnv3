name: rust
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tau-video/Cargo.toml --check
      - run: cargo clippy --manifest-path tau-video/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path tau-video/Cargo.toml --all-features
      - run: cargo doc --manifest-path tau-video/Cargo.toml --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --manifest-path tau-video/Cargo.toml --all-features
