[package]
name = "tau-encoder"
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[features]
default = []
experimental-rust-encoder = ["tau-video/experimental-rust-encoder", "tau-video/safe-rate"]

[dependencies]
tau-video = { path = "../../tau-video", features = ["c-encoder", "experimental-c-orchestrator", "c-audio-decoder", "subtitle-builder"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
