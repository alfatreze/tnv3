[package]
name = "tau-encoder"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[features]
default = []
experimental-rust-encoder = ["tau-video/experimental-rust-encoder", "tau-video/safe-rate"]

[dependencies]
tau-video = { path = "../../tau-video", features = ["c-encoder"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
